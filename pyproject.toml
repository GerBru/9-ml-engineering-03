[project]
name = "medical-triage"
version = "0.1.0"
description = "Deploy de Modelo em Produção com Pipeline CI/CD, Monitoramento e Otimização de Latência."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medical_triage"]
