[project]
name = "medical-triage"
version = "0.1.0"
description = "Deploy de Modelo em Produção com Pipeline CI/CD, Monitoramento e Otimização de Latência."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "joblib>=1.6.0",
    "scikit-learn>=1.9.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]
training = [
    "pandas>=3.0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medical_triage"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# E = erros de estilo (espaços, indentação)
# F = pyflakes (import não usado, variável indefinida)
# I = isort (ordem dos imports)
# B = bugbear (armadilhas comuns)
