[project]
name = "medical-triage"
version = "0.1.0"
description = "Deploy de Modelo em Produção com Pipeline CI/CD, Monitoramento e Otimização de Latência."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "joblib>=1.6.0",
    "scikit-learn==1.9.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.5",
]
training = [
    "dvc[gdrive]",
    "pandas>=3.0.5",
    "pyyaml>=6.0",
]

[tool.uv]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medical_triage"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
source = ["training", "src/medical_triage"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# E = erros de estilo (espaços, indentação)
# F = pyflakes (import não usado, variável indefinida)
# I = isort (ordem dos imports)
# B = bugbear (armadilhas comuns)
